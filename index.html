<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotool — Sign In</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
<!-- Sign in (Figma 88:41766, 1366 × 657) -->
<div class="login">
  <img class="login__backdrop" src="assets/illustrations/login-backdrop.svg" width="833" height="657" alt="">
  <img class="login__brand" src="assets/logo-promotool.png" width="272" height="40" alt="Stellantis Promotool">

  <form class="login__form" id="login-form" novalidate>
    <h1 class="login__title">Welcome</h1>
    <div class="login__field">
      <label class="login__label" for="login-user">User Name</label>
      <span class="login__input"><input id="login-user" name="username" type="text" placeholder="Placeholder" autocomplete="username" required></span>
    </div>
    <div class="login__field">
      <label class="login__label" for="login-password">Password</label>
      <span class="login__input"><input id="login-password" name="password" type="password" placeholder="Placeholder" autocomplete="current-password" required><button class="login__eye" type="button" aria-label="Show password" aria-pressed="false"><img src="assets/icons/eye-bold.svg" width="16" height="16" alt=""></button></span>
    </div>
    <a class="login__forgot" href="#">Forgot Password?</a>
    <button class="login__submit" type="submit">Sign In</button>
    <p class="login__signup"><span>Don’t have account</span><a href="#">Sign Up</a></p>
  </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
