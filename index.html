<!DOCTYPE html>
<html lang="en" data-cxo-theme="wallStreet" data-cxo-font="editorial">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotool — Sign In</title>
  <link rel="stylesheet" href="cxo/fonts.css">
  <link rel="stylesheet" href="cxo/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
<!-- Sign in, CXO design system: brand panel in the menu-bar palette, form card on paper -->
<div class="login">
  <section class="login__showcase" aria-label="Stellantis Promotool">
    <div class="login__brand-row">
      <span class="sidebar__badge" aria-hidden="true">PT</span>
      <span class="login__brand-text"><span class="login__brand-name">Promotool</span><span class="login__brand-sub">Stellantis</span></span>
    </div>
    <div class="login__pitch">
      <p class="kicker login__kicker">Promotion planning</p>
      <h2 class="login__headline">Plan, simulate and approve promotions in one place.</h2>
      <ul class="login__steps">
        <li><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.667 12.667h10.666M2.667 10 5.333 6l2.667 1.333L10.667 4l2.666 2.667" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Configure</li>
        <li><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v2.667M8 11.333V14M2 8h2.667M11.333 8H14M3.757 3.757l1.886 1.886M10.357 10.357l1.886 1.886M3.757 12.243l1.886-1.886M10.357 5.643l1.886-1.886" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Simulate</li>
        <li><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 8 1.333 1.333L10 6.667M14 8A6 6 0 1 1 2 8a6 6 0 0 1 12 0Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Approve</li>
      </ul>
    </div>
    <svg class="login__chart" viewBox="0 0 520 220" aria-hidden="true">
      <defs>
        <linearGradient id="login-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B89B5E" stop-opacity="0.22"/><stop offset="1" stop-color="#B89B5E" stop-opacity="0"/></linearGradient>
      </defs>
      <g fill="#F4F1EA" opacity="0.06">
        <rect x="24" y="150" width="22" height="70" rx="4"/><rect x="86" y="128" width="22" height="92" rx="4"/><rect x="148" y="138" width="22" height="82" rx="4"/>
        <rect x="210" y="104" width="22" height="116" rx="4"/><rect x="272" y="112" width="22" height="108" rx="4"/><rect x="334" y="76" width="22" height="144" rx="4"/>
        <rect x="396" y="86" width="22" height="134" rx="4"/><rect x="458" y="48" width="22" height="172" rx="4"/>
      </g>
      <path d="M0 170 C60 160 80 120 130 126 S210 104 250 92 S330 88 370 62 S450 40 520 18 V220 H0 Z" fill="url(#login-area)"/>
      <path d="M0 170 C60 160 80 120 130 126 S210 104 250 92 S330 88 370 62 S450 40 520 18" fill="none" stroke="#B89B5E" stroke-width="2" stroke-linecap="round"/>
      <g fill="#0A1628" stroke="#B89B5E" stroke-width="2"><circle cx="130" cy="126" r="4.5"/><circle cx="250" cy="92" r="4.5"/><circle cx="370" cy="62" r="4.5"/></g>
    </svg>
    <img class="login__logo" src="assets/logo-promotool.png" width="272" height="40" alt="Stellantis Promotool">
  </section>

  <main class="login__panel">
    <form class="login__form" id="login-form" novalidate>
      <div class="login__head">
        <h1 class="login__title">Welcome back</h1>
        <p class="login__lead">Sign in to plan and track your promotions.</p>
      </div>
      <div class="login__field">
        <label class="login__label" for="login-user">User name</label>
        <span class="login__input"><input id="login-user" name="username" type="text" placeholder="e.g. Marcus Weber" autocomplete="username" required></span>
      </div>
      <div class="login__field">
        <label class="login__label" for="login-password">Password</label>
        <span class="login__input"><input id="login-password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required><button class="login__eye" type="button" aria-label="Show password" aria-pressed="false"><img src="assets/icons/eye-bold.svg" width="16" height="16" alt=""></button></span>
      </div>
      <a class="login__forgot" href="#">Forgot password?</a>
      <button class="login__submit" type="submit">Sign in</button>
      <p class="login__signup"><span>Don’t have an account?</span><a href="#">Sign up</a></p>
    </form>
  </main>
</div>
<script src="js/login.js"></script>
</body>
</html>
