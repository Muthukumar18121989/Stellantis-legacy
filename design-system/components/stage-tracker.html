<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Stage tracker</title>
<!--
  TwinX UI component: stage-tracker
  Name:     Stage tracker
  Category: Data display
  CSS:      css/base.css, css/configuration.css, css/reports.css, css/user-menu.css
  JS:       none
  Source:   kit/reports.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Horizontal stage tracker with icons.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--reports">
<!-- snippet:start -->
<section class="rp-card rp-card--stages">
  <h2 class="rp-title"><span class="rp-title__text">Promotion Stage Tracker</span><span class="rp-title__note">Total Pipeline: 41 Promotions</span></h2>
  <div class="rp-stages">
    <ol class="rp-steps">
        <li class="rp-step rp-step--edit" style="width:97px"><span class="rp-step__dot"><img src="assets/icons/step-edit.svg" width="24" height="24" alt=""></span><span class="rp-step__text">0<br>Created /Draft</span></li>
        <li class="rp-step rp-step--clock" style="width:120px"><span class="rp-step__dot"><img src="assets/icons/step-clock.svg" width="24" height="24" alt=""></span><span class="rp-step__text">3<br>Pending Approval</span></li>
        <li class="rp-step rp-step--checkbox" style="width:133px"><span class="rp-step__dot"><img src="assets/icons/step-checkbox.svg" width="24" height="24" alt=""></span><span class="rp-step__text">18<br>Planned / Approved</span></li>
        <li class="rp-step rp-step--chart-line" style="width:108px"><span class="rp-step__dot"><img src="assets/icons/step-chart-line.svg" width="24" height="24" alt=""></span><span class="rp-step__text">4<br>Active Currently</span></li>
        <li class="rp-step rp-step--circle-check" style="width:74px"><span class="rp-step__dot"><img src="assets/icons/step-circle-check.svg" width="24" height="24" alt=""></span><span class="rp-step__text">16<br>Completed</span></li>
    </ol>
  </div>
</section>
<!-- snippet:end -->
</div>

</body>
</html>
