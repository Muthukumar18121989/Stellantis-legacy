<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Filter bar (reports)</title>
<!--
  TwinX UI component: filters-report
  Name:     Filter bar (reports)
  Category: Buttons & inputs
  CSS:      css/base.css, css/configuration.css, css/reports.css, css/user-menu.css
  JS:       none
  Source:   kit/reports.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Report hub filter row with date range and Apply.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--reports">
<!-- snippet:start -->
<section class="rp-filters" aria-label="Filters">
  <div class="rp-filters__row">
    <button class="rp-select rp-select--soft" type="button" style="width:299px"><span class="rp-select__value">Market</span><img src="assets/icons/chevron-down.svg" width="16" height="16" alt=""></button>
    <button class="rp-select" type="button" style="width:298px"><span class="rp-select__value">All Product Family</span><img src="assets/icons/chevron-down.svg" width="16" height="16" alt=""></button>
    <button class="rp-select" type="button" style="width:298px"><span class="rp-select__value">All Parts</span><img src="assets/icons/chevron-down.svg" width="16" height="16" alt=""></button>
    <button class="rp-select" type="button" style="width:298px"><span class="rp-select__value">Promotion Status</span><img src="assets/icons/chevron-down.svg" width="16" height="16" alt=""></button>
  </div>
  <div class="rp-filters__row">
    <div class="rp-filters__dates">
      <button class="rp-select" type="button" style="width:298px"><span class="rp-select__value">Choose Start Date</span><img src="assets/icons/calendar.svg" width="16" height="16" alt=""></button>
      <button class="rp-select" type="button" style="width:298px"><span class="rp-select__value">Choose End Date</span><img src="assets/icons/calendar.svg" width="16" height="16" alt=""></button>
    </div>
    <div class="rp-filters__actions">
      <button class="icon-btn" type="button" aria-label="Refresh"><img src="assets/icons/refresh.svg" width="16" height="16" alt=""></button>
      <button class="rp-btn" type="button">Apply</button>
    </div>
  </div>
</section>
<!-- snippet:end -->
</div>

</body>
</html>
