<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Approve with comments dialog</title>
<!--
  TwinX UI component: dialog-approve
  Name:     Approve with comments dialog
  Category: Dialogs
  CSS:      css/base.css, css/configuration.css, css/experiment.css, css/experiment-status.css, css/user-menu.css
  JS:       none
  Source:   kit/experiment-status.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Confirmation dialog with comments box (approve / reject).
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/experiment.css">
  <link rel="stylesheet" href="css/experiment-status.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--status">
<!-- snippet:start -->
<dialog class="es-dialog" id="es-approve" aria-labelledby="es-approve-title">
  <form class="es-dialog__body" method="dialog">
    <div class="es-dialog__head">
      <h2 class="es-dialog__title" id="es-approve-title">Approve Request</h2>
      <p class="es-dialog__text">Please provide your comments for this approval</p>
    </div>
    <label class="es-dialog__comments"><textarea name="comments" placeholder="Comments" aria-label="Comments"></textarea><img src="assets/icons/textarea-resize.svg" width="14" height="14" alt=""></label>
    <div class="es-dialog__actions">
      <button class="es-dialog__btn" type="button" data-close-dialog>Cancel</button>
      <button class="es-dialog__btn es-dialog__btn--primary" type="submit" value="submit">Submit</button>
    </div>
  </form>
  <button class="es-dialog__close" type="button" aria-label="Close" data-close-dialog><img src="assets/icons/x.svg" width="24" height="24" alt=""></button>
</dialog>
<!-- snippet:end -->
</div>
<script>(function(){var d=document.querySelector("#es-approve");if(d){d.removeAttribute('hidden');try{d.showModal()}catch(e){d.setAttribute('open','')}}})();</script>

</body>
</html>
