<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Validator Comments dialog</title>
<!--
  TwinX UI component: dialog-validator-comments
  Name:     Validator Comments dialog
  Category: Dialogs
  CSS:      css/base.css, css/configuration.css, css/result.css, css/validation.css, css/workflow.css, css/user-menu.css
  JS:       none
  Source:   kit/workflow-tracker.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Comments thread per validator.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/validation.css">
  <link rel="stylesheet" href="css/workflow.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--workflow">
<!-- snippet:start -->
<dialog class="wf-comments" id="validator-comments" aria-labelledby="wf-comments-title">
  <button class="wf-comments__close" type="button" aria-label="Close" data-close-dialog><img src="assets/icons/x.svg" width="24" height="24" alt=""></button>
  <div class="wf-comments__body">
    <div class="wf-comments__head">
      <h2 class="wf-comments__title" id="wf-comments-title">VALIDATOR COMMENTS</h2>
      <p class="wf-comments__stage">STAGE: L1.1</p>
    </div>
    <article class="wf-comment">
      <div class="wf-comment__row">
        <div class="wf-comment__who">
          <span class="wf-avatar"><img src="assets/icons/letter-j.svg" width="24" height="24" alt=""></span>
          <span class="wf-comment__person"><span class="wf-comment__name">Jean-Pierre</span><span class="wf-comment__role">LOCAL MARKETING MANAGER</span></span>
        </div>
        <div class="wf-comment__meta"><span class="wf-comment__badge">APPROVED</span><span class="wf-comment__date">22 MAR, 10:15:00</span></div>
      </div>
      <p class="wf-comment__text">“Volume projections look realistic for the Spring season. Margin is slightly tighter than usual but offset by incremental gains.”</p>
    </article>
  </div>
</dialog>
<!-- snippet:end -->
</div>
<script>(function(){var d=document.querySelector("#validator-comments");if(d){d.removeAttribute('hidden');try{d.showModal()}catch(e){d.setAttribute('open','')}}})();</script>

</body>
</html>
