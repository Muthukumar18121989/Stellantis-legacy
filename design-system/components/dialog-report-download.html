<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Customize Your Report dialog</title>
<!--
  TwinX UI component: dialog-report-download
  Name:     Customize Your Report dialog
  Category: Dialogs
  CSS:      css/base.css, css/configuration.css, css/reports.css, css/user-menu.css
  JS:       none
  Source:   kit/reports.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Checkbox table of report sections with PDF / CSV buttons.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--reports">
<!-- snippet:start -->
<dialog class="rp-download" id="report-download" aria-labelledby="rp-download-title">
  <button class="rp-download__close" type="button" aria-label="Close" data-close-dialog><img src="assets/icons/x.svg" width="24" height="24" alt=""></button>
  <div class="rp-download__head">
    <h2 class="rp-download__title" id="rp-download-title">Customize Your Report</h2>
    <p class="rp-download__text">Select Sections and details to include. The download will reflect the current filter selection.</p>
  </div>
  <div class="rp-dl">
    <table class="rp-dl__table">
      <colgroup><col style="width:31px"><col style="width:298px"><col style="width:298px"></colgroup>
      <thead>
        <tr><th class="rp-dl__cell rp-dl__cell--all" scope="col"><input class="rp-checkbox" type="checkbox" aria-label="Select all sections"></th><th class="rp-dl__cell" scope="col">Promotions</th><th class="rp-dl__cell" scope="col">Advanced Analytics</th></tr>
      </thead>
      <tbody>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Promotion Stage Tracker</span></label></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Trend Analysis</span></label></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Promotion Performance Summary</span></label></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Price Elasticity</span></label></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Promotion Tracking by Individual Promos</span></label></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Seasonality Analysis</span></label></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Promotion Tracking by Family</span></label></td><td class="rp-dl__cell"></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Promotion Tracking Details</span></label></td><td class="rp-dl__cell"></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell rp-dl__cell--sub"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Overview</span></label></td><td class="rp-dl__cell"></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell rp-dl__cell--sub"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Family &amp; Parts Performance</span></label></td><td class="rp-dl__cell"></td></tr>
        <tr><td class="rp-dl__cell"></td><td class="rp-dl__cell rp-dl__cell--sub"><label class="rp-dl__option"><input class="rp-checkbox" type="checkbox"><span>Dealer Participants</span></label></td><td class="rp-dl__cell"></td></tr>
      </tbody>
    </table>
  </div>
  <div class="rp-download__actions">
    <button class="rp-download__btn" type="button">Download as PDF</button>
    <button class="rp-download__btn" type="button">Download as CSV</button>
  </div>
</dialog>
<!-- snippet:end -->
</div>
<script>(function(){var d=document.querySelector("#report-download");if(d){d.removeAttribute('hidden');try{d.showModal()}catch(e){d.setAttribute('open','')}}})();</script>

</body>
</html>
