<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · App shell</title>
<!--
  TwinX UI component: app-shell
  Name:     App shell
  Category: App shell
  CSS:      css/base.css, css/experiment.css, css/user-menu.css
  JS:       none
  Source:   kit/experiments.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Page frame used by every signed-in page: .page > .left-bar + .main > .top-menu + page body. Fluid from 1280px; the left bar runs full height. Start every new page from this (or from a template).
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/experiment.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview ds-preview--shell">

<!-- snippet:start -->
<div class="page page--experiment">

  <nav class="left-bar" aria-label="Primary">
    <button class="left-bar__toggle" aria-label="Menu"><img src="assets/icons/menu.svg" width="24" height="24" alt=""></button>
    <div class="left-bar__menus">
      <a class="left-bar__item" href="promotool-dashboard.html" aria-label="Promotool Dashboard"><img src="assets/icons/grid-dots.svg" width="24" height="24" alt=""></a>
      <a class="left-bar__item left-bar__item--active" href="experiments.html" aria-label="Experiments" aria-current="page"><img src="assets/icons/route.svg" width="24" height="24" alt=""></a>
      <a class="left-bar__item" href="reports.html" aria-label="Reports"><img src="assets/icons/report-analytics.svg" width="24" height="24" alt=""></a>
    </div>
  </nav>

  <div class="main">

    <header class="top-menu">
      <div class="top-menu__logo">
        <div class="brand">
          <img class="brand__logo" src="assets/logo-promotool.png" width="190" height="28" alt="Stellantis Promotool">
        </div>
      </div>
      <div class="top-menu__right">
        <button class="notif" aria-label="Notifications (5)">
          <img src="assets/icons/bell.svg" width="24" height="24" alt="">
          <span class="notif__badge"><img src="assets/shapes/notification-oval.svg" width="16" height="16" alt=""></span>
          <span class="notif__count">5</span>
        </button>
        <button class="lang">
          <span class="lang__label">English</span>
          <span class="lang__icons">
            <img src="assets/icons/world.svg" width="24" height="24" alt="">
            <img src="assets/icons/chevron-down.svg" width="16" height="16" alt="">
          </span>
        </button>
        <button class="profile">
          <span class="profile__name">MARCUS WEBER</span>
          <span class="profile__role">Promotion Pilot (EE) <img src="assets/shapes/caret-down.svg" width="8" height="5" alt=""></span>
        </button>
      </div>
    </header>

    <main class="exp-body">
      <!-- Page content: cards, filters, tables. Copy components from the catalogue. -->
    </main>
  </div>
</div>
<!-- snippet:end -->


</body>
</html>
