<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Article Selection Core bar</title>
<!--
  TwinX UI component: selection-core
  Name:     Article Selection Core bar
  Category: Data display
  CSS:      css/base.css, css/configuration.css, css/user-menu.css
  JS:       none
  Source:   kit/selection-analysis.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    One 48px line: title | counts | Manage Families.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--selection">
<!-- snippet:start -->
<section class="sel-summary">
  <div class="sel-summary__text">
    <h2 class="sel-summary__title">Article Selection Core</h2>
    <p class="sel-summary__meta" data-selection-meta>0 Families | 0 Targeted SKUs</p>
  </div>
  <!-- Promotion being configured: name + ID, type and time period on the same line (Muthu, 2026-10-28); values from the query string, js/selection-analysis.js -->
  <dl class="sel-promo" aria-label="Promotion">
    <div class="sel-promo__item sel-promo__item--name"><dt>Promo</dt><dd><span class="sel-promo__name" data-promo-name title="Spring Promotion">Spring Promotion</span><span class="sel-promo__id" data-promo-id>#Req-9902</span></dd></div>
    <div class="sel-promo__item sel-promo__item--type"><dt>Type</dt><dd data-promo-type title="Discount on MSRP at article level, for the NSC/ importer’s, with/without threshold">Discount on MSRP at article level</dd></div>
    <div class="sel-promo__item sel-promo__item--period"><dt><img src="assets/icons/calendar.svg" width="16" height="16" alt="Time period"></dt><dd data-promo-period>20 Apr – 29 Apr 2026 <span class="sel-promo__days">(10 days)</span></dd></div>
  </dl>
  <button class="btn-icon-primary" type="button" data-open-dialog="select-family"><img src="assets/icons/plus.svg" width="16" height="16" alt="">Manage Families</button>
</section>
<!-- snippet:end -->
</div>

</body>
</html>
