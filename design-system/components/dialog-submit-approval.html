<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Submit for Approval dialog</title>
<!--
  TwinX UI component: dialog-submit-approval
  Name:     Submit for Approval dialog
  Category: Dialogs
  CSS:      css/base.css, css/configuration.css, css/result.css, css/validation.css, css/user-menu.css
  JS:       none
  Source:   kit/logistics-volume-split.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Radio choices and Proceed.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/validation.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--validation">
<!-- snippet:start -->
<dialog class="sa-dialog" id="submit-approval" aria-labelledby="sa-title">
  <button class="sa-dialog__close" type="button" aria-label="Close" data-close-dialog><img src="assets/icons/x.svg" width="24" height="24" alt=""></button>
  <div class="sa-head">
    <h2 class="sa-head__title" id="sa-title">Submit Promotion for Approval</h2>
    <p class="sa-head__sub">Please review the details before proceeding.</p>
  </div>
  <label class="sa-row"><span class="sa-row__label">Promotion Name</span><span class="sa-row__box"><input type="text" value="Summer Beverage Promotion 2026" data-approval-name></span></label>
  <label class="sa-row"><span class="sa-row__label">Iteration</span><span class="sa-row__box"><input type="text" value="Iteration 3"></span></label>
  <div class="sa-row sa-row--strategy" role="radiogroup" aria-labelledby="sa-strategy">
    <span class="sa-row__label" id="sa-strategy">Select Strategy</span>
    <div class="sa-radios">
      <label class="sa-radio"><input type="radio" name="sa-strategy" value="user" checked>User Input (Discount values entered by user)</label>
      <label class="sa-radio"><input type="radio" name="sa-strategy" value="twinx">TwinX Recommended (Discount Values generated by TwinX optimization)</label>
    </div>
  </div>
  <div class="sa-actions"><a class="sa-proceed" href="workflow-tracker.html" data-keep-query>Proceed to Approval</a></div>
</dialog>
<!-- snippet:end -->
</div>
<script>(function(){var d=document.querySelector("#submit-approval");if(d){d.removeAttribute('hidden');try{d.showModal()}catch(e){d.setAttribute('open','')}}})();</script>

</body>
</html>
