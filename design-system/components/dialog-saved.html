<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Saved confirmation dialog</title>
<!--
  TwinX UI component: dialog-saved
  Name:     Saved confirmation dialog
  Category: Dialogs
  CSS:      css/base.css, css/configuration.css, css/admin.css, css/user-menu.css
  JS:       none
  Source:   kit/user-edit.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)

  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/configuration.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/user-menu.css">

<body class="ds-preview">
<div class="ds-scope page--admin page--user-edit">
<!-- snippet:start -->
<dialog class="ad-dialog ad-dialog--saved" id="ue-saved" aria-labelledby="ue-saved-title">
  <button class="ad-dialog__close" type="button" data-close-dialog aria-label="Close"><img src="assets/icons/x.svg" width="24" height="24" alt=""></button>
  <span class="ad-dialog__mark"></span>
  <h2 class="ad-dialog__saved-title" id="ue-saved-title">User Saved Successfully</h2>
</dialog>
<!-- snippet:end -->
</div>
<script>(function(){var d=document.querySelector("#ue-saved");if(d){d.removeAttribute('hidden');try{d.showModal()}catch(e){d.setAttribute('open','')}}})();</script>

</body>
