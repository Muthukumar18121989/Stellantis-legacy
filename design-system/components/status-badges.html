<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../kit/">
  <title>TwinX UI · Status badges</title>
<!--
  TwinX UI component: status-badges
  Name:     Status badges
  Category: Data display
  CSS:      css/base.css, css/experiment.css, css/user-menu.css
  JS:       none
  Source:   kit/experiments.html (cut verbatim by scripts/build.py; do not edit by hand, edit the legacy page and rebuild)
  Usage:    Status badge with dot (progress = teal: Draft / Active / Analysis Completed; pending = yellow: Planned / Submitted), and the iteration badge.
  Copy the markup between snippet:start and snippet:end into a page that loads the CSS above.
  Paths (assets/..., css/...) are relative to the site root, exactly as in the legacy pages.
-->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/experiment.css">
  <link rel="stylesheet" href="css/user-menu.css">
  <link rel="stylesheet" href="../components/preview.css">
</head>
<body class="ds-preview">
<div class="ds-scope page--experiment"><div class="ds-gallery">
<!-- snippet:start -->
<span class="badge badge--progress" style="width:47px"><img src="assets/shapes/dot-teal.svg" width="8" height="8" alt=""><span class="badge__text">Draft</span></span>
<span class="badge badge--pending"><img src="assets/shapes/dot-yellow.svg" width="8" height="8" alt=""><span class="badge__text">Planned</span></span>
<span class="badge badge--pending"><img src="assets/shapes/dot-yellow.svg" width="8" height="8" alt=""><span class="badge__text">Submitted for Logistics Review​</span></span>
<span class="badge badge--progress"><img src="assets/shapes/dot-teal.svg" width="8" height="8" alt=""><span class="badge__text">Active</span></span>
<span class="badge badge--iteration"><span class="badge__text">Iteration 1</span></span>
<!-- snippet:end -->
</div></div>

</body>
</html>
